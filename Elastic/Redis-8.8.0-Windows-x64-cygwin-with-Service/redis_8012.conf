##################################
# NETWORK
##################################

# Chỉ cho phép kết nối từ máy local
# Nếu muốn cho phép máy khác truy cập thì dùng:
# bind 0.0.0.0
bind 127.0.0.1

# Bật chế độ bảo vệ Redis
# Nên luôn giữ yes
protected-mode yes

# Port Redis lắng nghe
port 8012

# Hàng đợi kết nối TCP
# Mặc định Redis là 511
tcp-backlog 511

# Không tự động đóng kết nối client khi idle
timeout 0

# Kiểm tra kết nối TCP mỗi 300 giây
tcp-keepalive 300

##################################
# GENERAL
##################################

# Linux dùng để chạy nền
# Windows thường bỏ qua cấu hình này
daemonize no

# Mức độ ghi log:
# debug | verbose | notice | warning
loglevel notice

# File log
logfile ""

# Số logical database
# Mặc định Redis là 16
databases 16

##################################
# SNAPSHOT (RDB)
##################################

# Tự động tạo dump.rdb khi:
# 900 giây có >= 1 thay đổi
save 900 1

# 300 giây có >= 10 thay đổi
save 300 10

# 60 giây có >= 10000 thay đổi
save 60 10000

# Nếu snapshot lỗi thì ngừng ghi dữ liệu
stop-writes-on-bgsave-error yes

# Nén file dump.rdb
rdbcompression yes

# Kiểm tra tính toàn vẹn dump.rdb
rdbchecksum yes

# Tên file snapshot
dbfilename dump.rdb

# Thư mục lưu dữ liệu
# Nên đổi theo port để dễ quản lý
dir "./data8012"

##################################
# MEMORY
##################################

# Giới hạn RAM Redis được phép sử dụng
maxmemory 512mb

# Khi đầy RAM:
# allkeys-lru = xóa key ít được dùng nhất
# Thích hợp cho cache
maxmemory-policy allkeys-lru

##################################
# APPEND ONLY FILE (AOF)
##################################

# Bật AOF để tăng khả năng phục hồi dữ liệu
appendonly yes

# Tên file AOF
appendfilename "appendonly.aof"

# Ghi xuống đĩa mỗi giây
# everysec là lựa chọn phổ biến nhất
appendfsync everysec

##################################
# CLIENTS
##################################

# Số client tối đa
maxclients 10000

##################################
# SECURITY
##################################

# Redis 6+ ACL
# Bỏ comment nếu muốn dùng tài khoản và mật khẩu
# user default on >MyStrongPassword123 ~* +@all

# Redis cũ (<6)
# requirepass MyStrongPassword123

##################################
# LAZY FREEING
##################################

# Xóa dữ liệu bất đồng bộ
# Giảm lag khi xóa key lớn

# Áp dụng khi Redis phải evict key
lazyfree-lazy-eviction yes

# Áp dụng khi key hết hạn
lazyfree-lazy-expire yes

# Áp dụng cho DEL nội bộ
lazyfree-lazy-server-del yes

##################################
# SLOW LOG
##################################

# Log các lệnh chạy lâu hơn 10ms
slowlog-log-slower-than 10000

# Lưu tối đa 128 bản ghi
slowlog-max-len 128

##################################
# LATENCY MONITOR
##################################

# Theo dõi các tác vụ mất hơn 100ms
latency-monitor-threshold 100

##################################
# ACTIVE REHASHING
##################################

# Tự động tối ưu hash table nội bộ
# Nên giữ mặc định
activerehashing yes