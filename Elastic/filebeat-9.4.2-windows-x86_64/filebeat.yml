# ============================== Filebeat Inputs ==============================
filebeat.inputs:
  - type: filestream
    id: gateway
    enabled: true
    paths:
      - "D:\\Mitalab_Testing\\BaseRepo\\Gateway\\Logs\\*.json"
    parsers:
      - ndjson:
          keys_under_root: true
          overwrite_keys: true
          add_error_key: true
    fields:
      service: gateway
    fields_under_root: true
    
  - type: filestream
    id: site
    enabled: true
    paths:
      - "D:\\Mitalab_Testing\\BaseRepo\\Site\\Logs\\*.json"
    parsers:
      - ndjson:
          keys_under_root: true
          overwrite_keys: true
          add_error_key: true
    fields:
      service: site
    fields_under_root: true

# ============================== Global Setup =============================
# Đẩy các cấu hình quản lý cấu trúc index ra ngoài root level
setup.ilm.enabled: false
setup.template.enabled: false

# ============================== Filebeat Outputs =============================
output.elasticsearch:
  hosts: ["localhost:8010"]
  index: "log-%{[service]}-%{+yyyy.MM.dd}"

# =================================== Kibana ===================================
setup.kibana:
  host: "localhost:8011"
  
# ================================= Processors =================================
processors:
  - add_host_metadata:
      when.not.contains.tags: forwarded

  # 1. Đổi tên @t (Serilog) thành @timestamp để khớp Elastic
  - copy_fields:
      fields:
        - from: "@t"
          to: "@timestamp"
      fail_on_error: false
      ignore_missing: true

  # 2. Xóa bỏ tận gốc các trường meta của Elastic giúp log JSON gọn nhẹ nhất
  - drop_fields:
      fields:
        - "agent"
        - "host"
        - "ecs"
        - "input"
        - "log"
      ignore_missing: true